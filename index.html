<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Giới thiệu các định dạng Audio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      color: #333;
    }

    header {
      background: #1e1e1e;
      color: white;
      padding: 30px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
    }

    h2 {
      margin-top: 40px;
    }

    .accordion-item {
      border-bottom: 1px solid #ddd;
    }

    .accordion-title {
      padding: 15px;
      cursor: pointer;
      background: #f0f0f0;
      font-weight: bold;
    }

    .accordion-title:hover {
      background: #e0e0e0;
    }

    .accordion-content {
      display: none;
      padding: 15px;
      background: #fafafa;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>Các định dạng Audio</h1>
  <p>Click vào từng mục để xem nội dung chi tiết</p>
</header>

<div class="container">

  <h2>Định dạng âm thanh phổ biến</h2>

  <div class="accordion-item">
    <div class="accordion-title">MP3</div>
    <div class="accordion-content">
      <p>Nội dung bạn tự phát triển…</p>
    </div>
  </div>

  <div class="accordion-item">
    <div class="accordion-title">FLAC</div>
    <div class="accordion-content">
      <p>Nội dung bạn tự phát triển…</p>
    </div>
  </div>

  <div class="accordion-item">
    <div class="accordion-title">WAV / AIFF</div>
    <div class="accordion-content">
      <p>Nội dung bạn tự phát triển…</p>
    </div>
  </div>

</div>

<footer>
  © 2026 - Audio Formats
</footer>

<!-- JS -->
<script>
  /* Accordion */
  const titles = document.querySelectorAll(".accordion-title");

  titles.forEach(title => {
    title.addEventListener("click", () => {
      const content = title.nextElementSibling;
      content.style.display =
        content.style.display === "block" ? "none" : "block";
    });
  });

  /* Chặn chuột phải + phím tắt */
  document.addEventListener("contextmenu", e => e.preventDefault());

  document.onkeydown = function(e) {
    if (e.keyCode === 123) return false; // F12
    if (e.ctrlKey && e.shiftKey && e.keyCode === 73) return false; // Ctrl+Shift+I
    if (e.ctrlKey && e.keyCode === 85) return false; // Ctrl+U
  };
</script>

</body>
</html>
