<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First GitHub Page</title>

  <style>
    /* Reset nhẹ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #111;
      color: #fff;
      padding: 1.5rem;
    }

    nav a {
      color: #fff;
      margin-right: 1rem;
      text-decoration: none;
      opacity: 0.8;
    }

    nav a:hover {
      opacity: 1;
    }

    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    section {
      background: #fff;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border-radius: 8px;
    }

    h1, h2 {
      margin-bottom: 0.5rem;
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>Xin chào 👋</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Giới thiệu</h2>
      <p>
        Đây là một trang HTML mẫu dùng để làm quen lại sau vài năm không code.
        Cấu trúc semantic, CSS gọn nhẹ, deploy tốt trên GitHub Pages.
      </p>
    </section>

    <section>
      <h2>Mục tiêu</h2>
      <ul>
        <li>Nhớ lại HTML & CSS</li>
        <li>Làm web không tốn tiền</li>
        <li>Deploy nhanh gọn</li>
      </ul>
    </section>
  </main>

  <footer>
    © 2026 – Made with HTML & CSS
  </footer>

</body>
</html>
